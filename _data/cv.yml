cv:
  name: Ehsan Farahbakhsh
  label: Research Fellow, Research School of Earth Sciences, The Australian National University
  email: Ehsan.Farahbakhsh@anu.edu.au
  location: Canberra, Australia
  image: ""
  summary: Machine learning and data science for mineral exploration, with a focus on spatio-temporal prospectivity modelling that links plate tectonics and geodynamics to where and when ore deposits form.

  social_networks:
    - network: GitHub
      username: e-farahbakhsh
