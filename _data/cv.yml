  sections:
    Experience:
      - company: Research School of Earth Sciences, The Australian National University
        position: Research Fellow
        location: Canberra, Australia
        start_date: 2026
        highlights:
          - Developing a machine learning framework for spatio-temporal mineral prospectivity modelling in the GEM-Cu (Geodynamic Environments for Mineralisation of Copper) industry project with Rio Tinto, The University of British Columbia and Imperial College London (supervisor Prof. D. Rhodri Davies).

      - company: EarthByte Group, School of Geosciences, The University of Sydney
        position: Research Associate
        location: Sydney, Australia
        start_date: 2021
        end_date: 2026
        highlights:
          - Developed machine learning frameworks for 2D and spatio-temporal prospectivity modelling in the PLATO and STELLAR industry projects with Datarock, Lithodat, BHP and Curtin University (supervisor Prof. R. Dietmar Müller).
          - Developed computer vision frameworks for remote sensing-based mapping of mineralisation-related geological features.
          - Lecturer of GEOL3888 (Earth Systems Research Project) and SCDL1991 (The Dalyell Showcase).
          - Supervised or co-supervised postgraduate students, research assistants and interns.

      - company: Industry
        position: Exploration geology and remote sensing roles
        location: Iran
        start_date: 2011
        end_date: 2021
        highlights:
          - Part-time Exploration Geologist, Karen GeoComputation Company (2016–2021)
          - Remote Sensing Specialist, Geological Survey of Iran (2015–2016)
          - Supervising and consulting engineering roles in mining (2011–2015)

